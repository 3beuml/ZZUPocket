org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ⚠️ 不要在仓库里写机器相关的路径（例如 org.gradle.java.home）。
# 本项目需要 JDK 21：Gradle 8.9 只支持到 JDK 22，而 Android Studio 自带的 JBR 是 JDK 25，
# 用它同步会报 Unsupported class file major version。
# 需要指定 JDK 的话，写在自己机器的 ~/.gradle/gradle.properties 里，例如：
#   org.gradle.java.home=C:/Program Files/Java/jdk-21

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.7.3 官方只测到 compileSdk 35，本项目用 36；压掉每次构建的警告
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
